{% extends "base.html" %}
{% block content %}
<h2>Data Schemas</h2>
  <a href="{% url 'schemas:schema_create' %}" class="btn btn-primary">New Schema</a>
<ul>
    {% for schema in schemas %}
        <li><a href="{% url 'schemas:schema_detail' schema.pk %}">{{ schema.name }}</a> (Updated: {{ schema.updated_at }})</li>
    {% empty %}
        <li>No schemas found.</li>
    {% endfor %}
</ul>
{% endblock %}
