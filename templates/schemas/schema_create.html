{% extends "base.html" %}
{% block content %}
<h2>Create New Schema</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {{ formset.management_form }}

    <div id="columns">
        {% for form in formset %}
            <div class="column-form">
                {{ form.as_p }}
            </div>
        {% endfor %}
    </div>

    <button type="submit">Save Schema</button>
</form>
{% endblock %}
