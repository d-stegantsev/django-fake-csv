{% extends "base.html" %}

{% block content %}
  <h2 class="mb-4 d-flex align-items-center">
    {{ schema.name }}
    <a href="{% url 'schemas:schema_update' schema.pk %}" class="btn btn-outline-secondary ms-3 btn-sm">Edit schema</a>
  </h2>

  <div class="card mb-4">
    <div class="card-header fw-bold">Schema columns</div>
    <div class="card-body p-0">
      <table class="table table-bordered mb-0 align-middle">
        <thead class="table-light">
        <tr>
          <th style="width:4rem;">#</th>
          <th>Column name</th>
          <th>Column type</th>
        </tr>
        </thead>
        <tbody>
        {% for col in columns %}
          <tr>
            <td>{{ forloop.counter }}</td>
            <td>{{ col.name }}</td>
            <td>{{ col.get_type_display }}</td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="3" class="text-center text-muted">No columns added yet.</td>
          </tr>
        {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
{% endblock %}
