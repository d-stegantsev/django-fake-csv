{% extends "base.html" %}
{% block content %}
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card shadow">
          <div class="card-body text-center">
            <h2 class="mb-4 text-danger">Delete schema</h2>
            <p class="mb-3">
              Are you sure you want to <b>delete</b> schema<br>
              <span class="fw-bold">{{ object.name }}</span>?
            </p>
            <form method="post">
              {% csrf_token %}
              <div class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-danger px-4">Yes, delete</button>
                <a href="{% url 'schemas:schema_list' %}" class="btn btn-secondary px-4">Cancel</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
