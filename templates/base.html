<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}FakeCSV{% endblock %}</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container">
    <!-- Зліва: логотип і Schemas -->
    <a class="navbar-brand me-4" href="#">FakeCSV</a>
    <a class="nav-link d-inline px-2" href="{% url 'schemas:schema_list' %}">Schemas</a>
    <div class="flex-grow-1"></div>
    <!-- Справа: вітання і логаут -->
    {% if user.is_authenticated %}
      <span class="me-3 text-muted">
                Hello, <strong>{{ user.username }}</strong>
            </span>
      <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-secondary btn-sm" style="vertical-align: middle;">Logout</button>
      </form>
    {% else %}
      <a class="btn btn-outline-primary btn-sm" href="{% url 'login' %}">Login</a>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
