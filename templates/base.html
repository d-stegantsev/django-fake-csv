<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}FakeCSV{% endblock %}</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="#">FakeCSV</a>
    <div>
      <a class="nav-link d-inline" href="{% url 'schemas:schema_list' %}">Schemas</a>
      {% if user.is_authenticated %}
        <span class="ms-3 text-muted">Hello, <strong>{{ user.username }}</strong></span>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="btn btn-link" style="padding: 0;">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-link" href="{% url 'login' %}">Login</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
